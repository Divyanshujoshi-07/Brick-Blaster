<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BRICK BREAKER</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="bg-grid"></div>

  <div id="app">
    <!-- Header -->
    <header>
      <div class="logo">BRICK<span>BREAKER</span></div>
      <div class="hud">
        <div class="hud-item">
          <span class="hud-label">SCORE</span>
          <span class="hud-value" id="score">000</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">LIVES</span>
          <div class="lives" id="lives">
            <span class="heart">♥</span>
            <span class="heart">♥</span>
            <span class="heart">♥</span>
          </div>
        </div>
        <div class="hud-item">
          <span class="hud-label">LEVEL</span>
          <span class="hud-value" id="level">01</span>
        </div>
      </div>
    </header>

    <!-- Canvas Wrapper -->
    <div class="canvas-wrapper">
      <canvas id="gameCanvas"></canvas>

      <!-- Overlays -->
      <div class="overlay" id="startOverlay">
        <div class="overlay-box">
          <div class="overlay-title glitch" data-text="BRICK BREAKER">BRICK BREAKER</div>
          <p class="overlay-sub">Move mouse / touch to control paddle</p>
          <button class="btn-start" id="startBtn">START GAME</button>
        </div>
      </div>

      <div class="overlay hidden" id="gameOverOverlay">
        <div class="overlay-box">
          <div class="overlay-title red">GAME OVER</div>
          <p class="overlay-sub">Your score: <span id="finalScore">0</span></p>
          <button class="btn-start" id="restartBtn">RESTART</button>
        </div>
      </div>

      <div class="overlay hidden" id="winOverlay">
        <div class="overlay-box">
          <div class="overlay-title gold">YOU WIN!</div>
          <p class="overlay-sub">Score: <span id="winScore">0</span></p>
          <button class="btn-start" id="nextLevelBtn">NEXT LEVEL</button>
        </div>
      </div>
    </div>

    <footer>USE MOUSE OR TOUCH TO MOVE PADDLE &nbsp;•&nbsp; CLICK TO LAUNCH BALL</footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
